name: Daily Sentiment Update

# Website scheduling now runs in the persistent shared updater on the server.
# Keep this legacy workflow manual-only so CI cannot independently overwrite
# data on another schedule or duplicate the server's weekly work.
on:
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-sentiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NLTK data
        run: |
          python -c "
          import nltk
          for pkg in ['punkt', 'punkt_tab', 'stopwords', 'wordnet', 'vader_lexicon']:
              nltk.download(pkg, quiet=True)
          "

      - name: Run sentiment update
        run: python sentiment_update.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figures/*.png figures/stage_*.csv last_updated_wordcloud.txt || true
          git diff --staged --quiet || git commit -m "chore: daily sentiment update $(date +'%Y-%m-%d')"
          git push || true
