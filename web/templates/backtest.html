{% extends "base.html" %}

{% block title %}策略回测 - Ansel Crypto Rank App{% endblock %}

{% block content %}
<div class="page-header">
    <h1 data-zh="📈 策略回测结果对比" data-en="📈 Strategy Backtest Results Comparison">📈 策略回测结果对比</h1>
</div>

<div class="content-section">
    <div class="metric-selector">
        <label class="metric-option">
            <input type="radio" name="metric" value="cum_return_comparison" checked onchange="loadBacktestImages()">
            <span data-zh="累计收益" data-en="Cumulative Return">累计收益</span>
        </label>
        <label class="metric-option">
            <input type="radio" name="metric" value="volatility_bar" onchange="loadBacktestImages()">
            <span data-zh="波动率" data-en="Volatility">波动率</span>
        </label>
        <label class="metric-option">
            <input type="radio" name="metric" value="mean_return_bar" onchange="loadBacktestImages()">
            <span data-zh="平均收益" data-en="Average Return">平均收益</span>
        </label>
        <label class="metric-option">
            <input type="radio" name="metric" value="sharpe_bar" onchange="loadBacktestImages()">
            <span data-zh="夏普比率" data-en="Sharpe Ratio">夏普比率</span>
        </label>
        <label class="metric-option">
            <input type="radio" name="metric" value="max_drawdown_bar" onchange="loadBacktestImages()">
            <span data-zh="最大回撤" data-en="Maximum Drawdown">最大回撤</span>
        </label>
    </div>
</div>

<div class="content-section">
    <div class="image-grid">
        <div class="image-card">
            <img id="backtest-all" alt="全部特征模型" data-alt-zh="全部特征模型" data-alt-en="All Features Model">
            <p class="image-caption" data-zh="全部特征模型" data-en="All Features Model">全部特征模型</p>
        </div>
        <div class="image-card">
            <img id="backtest-market" alt="市场特征模型" data-alt-zh="市场特征模型" data-alt-en="Market Features Model">
            <p class="image-caption" data-zh="市场特征模型" data-en="Market Features Model">市场特征模型</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.metric-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
}

.metric-option {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    transition: background-color 0.2s;
}

.metric-option:hover {
    background-color: #2a2a3a;
}

.metric-option input[type="radio"] {
    accent-color: #ff6b6b;
}

.image-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
    margin-top: 1rem;
}

.image-card {
    text-align: center;
}

.image-card img {
    max-width: 100%;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    min-height: 200px;
    background-color: #262730;
}

.image-caption {
    margin-top: 0.5rem;
    color: #888;
    font-size: 0.9rem;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/transparency.js?v=20261125-localized"></script>
{% endblock %}
